services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: don_mariano
      POSTGRES_USER: don_mariano
      POSTGRES_PASSWORD: don_mariano
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U don_mariano -d don_mariano"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
